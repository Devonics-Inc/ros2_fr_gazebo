# # This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 1000
    
    fairino5_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    test_rail_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

fairino5_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position

test_rail_controller:
  ros__parameters:
    joints:
      - test_rail_joint
    command_interfaces:
      - position

    state_interfaces:
      - position
