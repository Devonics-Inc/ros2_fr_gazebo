# # This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 125
    fairino5_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    sync_table2_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      
fairino5_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position

sync_table2_controller:
  ros__parameters:
    joints:
      - sync_table2_joint
      - bottom_drawer_joint
      - top_drawer_joint
    command_interfaces:
      - position
    state_interfaces:
      - position


joint_state_broadcaster:
  ros__parameters: {}